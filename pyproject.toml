[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "hilf-print"
version = "1.0.0"
description = "Organizador offline de etiquetas e pedidos — Hilf Streetwear"
requires-python = ">=3.12"
dependencies = ["PyMuPDF==1.26.5", "PySide6==6.10.0"]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "PyInstaller==6.16.0"]

[project.gui-scripts]
hilf-print = "hilf_print.__main__:main"

[tool.setuptools.packages.find]
include = ["hilf_print*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
